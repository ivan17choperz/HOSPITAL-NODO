spring:
  application:
    name: ms-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${KEYCLOAK_JWK_URI:http://localhost:8180/realms/hospital/protocol/openid-connect/certs}
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: false
      routes:
        - id: admission-docs
          uri: ${MS_ADMISSION_URL:http://localhost:8081}
          predicates:
            - Path=/v3/api-docs/admission
          filters:
            - SetPath=/v3/api-docs

        - id: discharge-docs
          uri: ${MS_DISCHARGE_URL:http://localhost:8082}
          predicates:
            - Path=/v3/api-docs/discharge
          filters:
            - SetPath=/v3/api-docs

        - id: emr-docs
          uri: ${MS_EMR_URL:http://localhost:8083}
          predicates:
            - Path=/v3/api-docs/emr
          filters:
            - SetPath=/v3/api-docs

        - id: laboratory-docs
          uri: ${MS_LABORATORY_URL:http://localhost:8084}
          predicates:
            - Path=/v3/api-docs/laboratory
          filters:
            - SetPath=/v3/api-docs

        - id: fhir-docs
          uri: ${MS_FHIR_ADAPTER_URL:http://localhost:8085}
          predicates:
            - Path=/v3/api-docs/fhir
          filters:
            - SetPath=/v3/api-docs

        - id: sync-docs
          uri: ${MS_SYNC_AGENT_URL:http://localhost:8086}
          predicates:
            - Path=/v3/api-docs/sync
          filters:
            - SetPath=/v3/api-docs

        - id: admission-route
          uri: ${MS_ADMISSION_URL:http://localhost:8081}
          predicates:
            - Path=/api/admission/**
          filters:
            - RewritePath=/api/admission/(?<segment>.*), /${segment}

        - id: discharge-route
          uri: ${MS_DISCHARGE_URL:http://localhost:8082}
          predicates:
            - Path=/api/discharge/**
          filters:
            - RewritePath=/api/discharge/(?<segment>.*), /${segment}

        - id: emr-route
          uri: ${MS_EMR_URL:http://localhost:8083}
          predicates:
            - Path=/api/emr/**
          filters:
            - RewritePath=/api/emr/(?<segment>.*), /${segment}

        - id: laboratory-route
          uri: ${MS_LABORATORY_URL:http://localhost:8084}
          predicates:
            - Path=/api/laboratory/**
          filters:
            - RewritePath=/api/laboratory/(?<segment>.*), /${segment}

        - id: fhir-route
          uri: ${MS_FHIR_ADAPTER_URL:http://localhost:8085}
          predicates:
            - Path=/api/fhir/**
          filters:
            - RewritePath=/api/fhir/(?<segment>.*), /${segment}

        - id: triage-route
          uri: ${MS_TRIAGE_URL:http://localhost:8087}
          predicates:
            - Path=/api/triage/**
          filters:
            - RewritePath=/api/triage/(?<segment>.*), /${segment}

        - id: triage-docs
          uri: ${MS_TRIAGE_URL:http://localhost:8087}
          predicates:
            - Path=/v3/api-docs/triage
          filters:
            - SetPath=/v3/api-docs

        - id: doctor-route
          uri: ${MS_DOCTOR_URL:http://localhost:8088}
          predicates:
            - Path=/api/doctor/**
          filters:
            - RewritePath=/api/doctor/(?<segment>.*), /${segment}

        - id: doctor-docs
          uri: ${MS_DOCTOR_URL:http://localhost:8088}
          predicates:
            - Path=/v3/api-docs/doctor
          filters:
            - SetPath=/v3/api-docs

        - id: sync-route
          uri: ${MS_SYNC_AGENT_URL:http://localhost:8086}
          predicates:
            - Path=/api/sync/**
          filters:
            - RewritePath=/api/sync/(?<segment>.*), /${segment}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: ms-admission
        url: /v3/api-docs/admission
      - name: ms-discharge
        url: /v3/api-docs/discharge
      - name: ms-emr
        url: /v3/api-docs/emr
      - name: ms-laboratory
        url: /v3/api-docs/laboratory
      - name: ms-fhir-adapter
        url: /v3/api-docs/fhir
      - name: ms-triage
        url: /v3/api-docs/triage
      - name: ms-sync-agent
        url: /v3/api-docs/sync
      - name: ms-doctor
        url: /v3/api-docs/doctor

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true

server:
  port: 8080
