      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    command: start-dev --import-realm
    volumes:
      - ./keycloak/hospital-realm.json:/opt/keycloak/data/import/hospital-realm.json:ro
    ports:
      - "8380:8080"
    networks:
      - node3-network

