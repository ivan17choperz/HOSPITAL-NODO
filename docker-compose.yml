      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq-node3
      - SERVER_PORT=8081
      - NODE_ID=node3
    depends_on:
