      - PEER_NODES=http://ms-sync-agent-node1:8086,http://ms-sync-agent-node2:8086
      - SERVER_PORT=8086
      - NODE_ID=node3
    depends_on:
      rabbitmq-node3:
        condition: service_healthy
      redis-node3:
        condition: service_healthy
    networks:
      - node3-network
      - inter-node-network

  ms-triage-node3:
    build: ./ms-triage
    profiles: ["node3"]
    container_name: hospital-node3-triage`r`n    restart: unless-stopped
    ports:
      - "8287:8087"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-node3:5432/hospital_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq-node3
      - SERVER_PORT=8087
      - NODE_ID=node3
    depends_on:
      postgres-node3:
        condition: service_healthy
      rabbitmq-node3:
        condition: service_healthy
    networks:
      - node3-network

  nginx-node3:
    image: nginx:alpine
    profiles: ["node3"]
    container_name: hospital-node3-gateway`r`n    restart: unless-stopped
    ports:
      - "8100:80"
    volumes:
      - ./nginx/node3.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ms-admission-node3
      - ms-discharge-node3
      - ms-emr-node3
      - ms-laboratory-node3
      - ms-fhir-adapter-node3
      - ms-sync-agent-node3
      - ms-triage-node3
    networks:
      - node3-network

networks:
  node1-network:
    driver: bridge
  node2-network:
    driver: bridge
  node3-network:
    driver: bridge
  inter-node-network:
    driver: bridge

volumes:
  postgres_data_node1:
  postgres_data_node1_replica:
  postgres_data_node2:
  postgres_data_node2_replica:
  postgres_data_node3:
  postgres_data_node3_replica:
