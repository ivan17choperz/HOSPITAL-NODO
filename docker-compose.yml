networks:
  node1-network:
    driver: bridge
  node2-network:
    driver: bridge
  node3-network:
    driver: bridge
  inter-node-network:
    driver: bridge

volumes:
  postgres_data_node1:
  postgres_data_node2:
  postgres_data_node3:
