## ============================================================
##  HOSPITAL DISTRIBUTED SYSTEM - 3 NODE SETUP
##  Usage:
##    Single node:  docker-compose --profile node1 up --build
##    All nodes:    docker-compose --profile node1 --profile node2 --profile node3 up --build
##  Management UIs (when running):
##    RabbitMQ Node1: http://localhost:15672  (guest/guest)
##    RabbitMQ Node2: http://localhost:15673  (guest/guest)
##    RabbitMQ Node3: http://localhost:15674  (guest/guest)
##    API Gateway Node1: http://localhost:80
##    API Gateway Node2: http://localhost:8080
##    API Gateway Node3: http://localhost:9080
## ============================================================

services:

  # ============================================================
  #  NODE 1 BOGOTA
  # ============================================================

  postgres-node1:
    image: postgres:17-alpine
    profiles: ["node1"]
    container_name: hospital-node1-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_node1:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

  rabbitmq-node1:
    image: rabbitmq:4-management-alpine
    profiles: ["node1"]
    container_name: hospital-node1-mq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

  redis-node1:
    image: redis:7-alpine
    profiles: ["node1"]
    container_name: hospital-node1-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

