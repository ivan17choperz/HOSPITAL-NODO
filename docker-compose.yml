## ============================================================
##  HOSPITAL DISTRIBUTED SYSTEM - 3 NODE SETUP
##  Usage:
##    Single node:  docker-compose --profile node1 up --build
##    All nodes:    docker-compose --profile node1 --profile node2 --profile node3 up --build
##  Management UIs (when running):
##    RabbitMQ Node1: http://localhost:15672  (guest/guest)
##    RabbitMQ Node2: http://localhost:15673  (guest/guest)
##    RabbitMQ Node3: http://localhost:15674  (guest/guest)
##    Spring Gateway Node1: http://localhost:8080
##    Spring Gateway Node2: http://localhost:8090
##    Spring Gateway Node3: http://localhost:8100
##    Swagger UI Node1:     http://localhost:8080/swagger-ui.html
##    Swagger UI Node2:     http://localhost:8090/swagger-ui.html
##    Swagger UI Node3:     http://localhost:8100/swagger-ui.html
##    Sync Status Node1:    http://localhost:8086/status
##    Sync Status Node2:    http://localhost:8186/status
##    Sync Status Node3:    http://localhost:8286/status
## ============================================================

services:

  # ============================================================
  #  NODE 1 BOGOTA
  # ============================================================

  postgres-node1:
    image: postgres:17-alpine
    profiles: ["node1"]
    container_name: hospital-node1-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hospital_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_node1:/var/lib/postgresql/data
      - ./postgres/init-primary.sql:/docker-entrypoint-initdb.d/init-primary.sql:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=5
      -c wal_keep_size=64
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d hospital_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

  postgres-node1-replica:
    image: postgres:17-alpine
    profiles: ["node1"]
    container_name: hospital-node1-db-replica
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      PRIMARY_HOST: postgres-node1
      REPL_USER: replicator
      REPL_PASSWORD: replicator_pass
      PGDATA: /var/lib/postgresql/data
    ports:
      - "5435:5432"
    volumes:
      - postgres_data_node1_replica:/var/lib/postgresql/data
      - ./postgres/init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh:ro
    entrypoint: ["/bin/bash", "/docker-entrypoint-initdb.d/init-replica.sh"]
    depends_on:
      postgres-node1:
        condition: service_healthy
    networks:
      - node1-network

  rabbitmq-node1:
    image: rabbitmq:4-management-alpine
    profiles: ["node1"]
    container_name: hospital-node1-mq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

  redis-node1:
    image: redis:7-alpine
    profiles: ["node1"]
    container_name: hospital-node1-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - node1-network

  keycloak-node1:
    image: quay.io/keycloak/keycloak:24.0.4
    profiles: ["node1"]
    container_name: hospital-node1-keycloak
    restart: unless-stopped
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
    command: start-dev --import-realm
    volumes:
      - ./keycloak/hospital-realm.json:/opt/keycloak/data/import/hospital-realm.json:ro
    ports:
      - "8180:8080"
    networks:
      - node1-network

  ms-admission-node1:
    build: ./ms-admission
    profiles: ["node1"]
    container_name: hospital-node1-admission
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-node1:5432/hospital_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq-node1
      - SERVER_PORT=8081
      - NODE_ID=node1
    depends_on:
      postgres-node1:
        condition: service_healthy
      rabbitmq-node1:
        condition: service_healthy
    networks:
      - node1-network

  ms-discharge-node1:
    build: ./ms-discharge
    profiles: ["node1"]
    container_name: hospital-node1-discharge
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-node1:5432/hospital_db
      - SPRING_DATASOURCE_USERNAME=user
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_RABBITMQ_HOST=rabbitmq-node1
      - SERVER_PORT=8082
      - NODE_ID=node1
