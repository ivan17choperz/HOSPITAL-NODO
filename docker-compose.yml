  ms-sync-agent-node1:
    build: ./ms-sync-agent
    profiles: ["node1"]
    container_name: hospital-node1-sync`r`n    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq-node1
      - SPRING_REDIS_HOST=redis-node1
      - MS_ADMISSION_URL=http://ms-admission-node1:8081
      - MS_DISCHARGE_URL=http://ms-discharge-node1:8082
      - MS_EMR_URL=http://ms-emr-node1:8083
      - MS_LABORATORY_URL=http://ms-laboratory-node1:8084
      - MS_FHIR_ADAPTER_URL=http://ms-fhir-adapter-node1:8085
      - PEER_NODES=http://ms-sync-agent-node2:8086,http://ms-sync-agent-node3:8086
      - SERVER_PORT=8086
      - NODE_ID=node1
    depends_on:
      rabbitmq-node1:
        condition: service_healthy
      redis-node1:
        condition: service_healthy
    networks:
      - node1-network
      - inter-node-network

  ms-triage-node1:
