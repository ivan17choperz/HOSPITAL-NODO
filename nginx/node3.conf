events {
    worker_connections 1024;
}

http {
    upstream admission    { server ms-admission-node3:8081; }
    upstream discharge    { server ms-discharge-node3:8082; }
    upstream emr          { server ms-emr-node3:8083; }
    upstream laboratory   { server ms-laboratory-node3:8084; }
    upstream fhir         { server ms-fhir-adapter-node3:8085; }
    upstream sync         { server ms-sync-agent-node3:8086; }
    upstream triage       { server ms-triage-node3:8087; }

    server {
        listen 80;
        server_name node3.hospital.local;

        add_header X-Hospital-Node "node3" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location /api/admission/ {
            proxy_pass http://admission/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/discharge/ {
            proxy_pass http://discharge/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/emr/ {
            proxy_pass http://emr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/laboratory/ {
            proxy_pass http://laboratory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/fhir/ {
            proxy_pass http://fhir/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/sync/ {
            proxy_pass http://sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/triage/ {
            proxy_pass http://triage/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 '{"node":"node3","status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
