events {
    worker_connections 1024;
}

http {
    upstream admission    { server ms-admission-node1:8081; }
    upstream discharge    { server ms-discharge-node1:8082; }
    upstream emr          { server ms-emr-node1:8083; }
    upstream laboratory   { server ms-laboratory-node1:8084; }
    upstream fhir         { server ms-fhir-adapter-node1:8085; }
    upstream sync         { server ms-sync-agent-node1:8086; }

    server {
        listen 80;
        server_name node1.hospital.local;

        add_header X-Hospital-Node "node1" always;

        location /api/admission/ {
            proxy_pass http://admission/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/discharge/ {
            proxy_pass http://discharge/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/emr/ {
            proxy_pass http://emr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/laboratory/ {
            proxy_pass http://laboratory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/fhir/ {
            proxy_pass http://fhir/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/sync/ {
            proxy_pass http://sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 '{"node":"node1","status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
