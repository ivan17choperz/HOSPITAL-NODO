events {
    worker_connections 1024;
}

http {
    upstream admission    { server ms-admission-node2:8081; }
    upstream discharge    { server ms-discharge-node2:8082; }
    upstream emr          { server ms-emr-node2:8083; }
    upstream laboratory   { server ms-laboratory-node2:8084; }
    upstream fhir         { server ms-fhir-adapter-node2:8085; }
    upstream sync         { server ms-sync-agent-node2:8086; }

    server {
        listen 80;
        server_name node2.hospital.local;

        add_header X-Hospital-Node "node2" always;

        location /api/admission/ {
            proxy_pass http://admission/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/discharge/ {
            proxy_pass http://discharge/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/emr/ {
            proxy_pass http://emr/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/laboratory/ {
            proxy_pass http://laboratory/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/fhir/ {
            proxy_pass http://fhir/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/sync/ {
            proxy_pass http://sync/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            access_log off;
            return 200 '{"node":"node2","status":"UP"}';
            add_header Content-Type application/json;
        }
    }
}
